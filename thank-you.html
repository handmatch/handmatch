<script src="/assets/hm-runtime.js"></script>
<script>
class Component extends DCLogic {

  componentDidMount() {
    const q = new URLSearchParams(location.search);
    const sid = q.get('session_id');
    const oid = q.get('order_id');
    if (!sid && !oid) return;
    fetch('/api/order?' + (sid ? 'session_id=' + encodeURIComponent(sid) : 'order_id=' + encodeURIComponent(oid)))
      .then((r) => (r.ok ? r.json() : null))
      .then((o) => {
        if (!o) return;
        this.setState({ order: o });
        // Web app: sign the family straight into their account after paying.
        if (o.status === 'paid') {
          fetch('/api/auth?action=order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sid ? { session_id: sid } : { order_id: oid }) })
            .then((r) => (r.ok ? r.json() : null))
            .then((a) => { if (a && a.app) this.setState({ account: a }); })
            .catch(() => {});
        }
        // Tell Google Ads about the payment, once per order.
        const ads = window.HM_ADS || {};
        const key = 'hm:conv:' + (o.order_ref || '');
        let seen = false;
        try { seen = !!localStorage.getItem(key); } catch (e) { /* private mode */ }
        if ((o.status === 'paid' || sid) && ads.purchaseLabel && window.gtag && !seen) {
          gtag('event', 'conversion', {
            send_to: ads.id + '/' + ads.purchaseLabel,
            value: (o.amount_cents || 34900 * (o.hires || 1)) / 100,
            currency: 'USD',
            transaction_id: o.order_ref || ''
          });
          try { localStorage.setItem(key, '1'); } catch (e) { /* private mode */ }
        }
      })
      .catch(() => {});
  }
  renderVals() {
    const o = (this.state && this.state.order) || {};
    const acc = this.state && this.state.account;
    const p = { fullName: o.full_name || 'there', email: o.email || 'your inbox', hires: o.hires || 1 };
    const n = Math.max(1, Number(p.hires) || 1);
    const name = (p.fullName || 'there').trim();
    return {
      firstName: name.split(/\s+/)[0],
      email: p.email,
      nextHref: '/next-steps' + location.search,
      totalLabel: '$' + (o.amount_cents ? o.amount_cents / 100 : 349 * n).toLocaleString('en-US'),
      hireText: n === 1 ? '1 hire' : n + ' hires',
      feeWord: o.fee_type === 'deposit' ? 'deposit' : 'one-time fee',
      depositNote: o.fee_type === 'deposit' ? ' You only pay the balance when you choose to hire.' : '',
      order: o.order_ref || '',
      isTest: new URLSearchParams(location.search).get('test') === '1',
      showAccount: !!(acc && (acc.signed_in || acc.used)),
      showNextSteps: !(acc && (acc.signed_in || acc.used)),
      accountNote: !acc ? '' : acc.signed_in ? 'Your handmatch account is ready. Meet your Concierge, follow each step and message us any time.'
        : acc.sent ? 'We’ve emailed you a link to open your handmatch account.'
          : acc.used ? 'Sign in with your email to open your account.' : ''
    };
  }
}
window.Component = Component;
</script>
