<script>window.HM_PROPS = {"showBea": false, "showPricing": false, "companyShare": 50};</script>
<script src="/assets/hm-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { price: 160, freq: 'biweekly', menu: false };
  }
  renderVals() {
    const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
    const sharePct = this.props.companyShare ?? 50;
    const price = this.state.price;
    const opts = [
      { id: 'weekly', label: 'Weekly', visits: 52 },
      { id: 'biweekly', label: 'Every 2 weeks', visits: 26 },
      { id: 'monthly', label: 'Monthly', visits: 12 }
    ];
    const current = opts.find((o) => o.id === this.state.freq) || opts[1];
    const yearly = price * current.visits;
    const saved = yearly * sharePct / 100;
    const net = Math.max(0, saved - 349);
    const menu = !!this.state.menu;
    const wl = this.state.wl || { city: '', email: '', busy: false, msg: '' };
    const setWl = (patch) => this.setState({ wl: Object.assign({}, wl, patch) });
    const waitlist = {
      wlCity: wl.city, wlEmail: wl.email, wlMsg: wl.msg, wlButton: wl.busy ? 'Sending…' : 'Notify me',
      onWlCity: (e) => setWl({ city: e.target.value, msg: '' }),
      onWlEmail: (e) => setWl({ email: e.target.value, msg: '' }),
      onWaitlist: async (e) => {
        e.preventDefault();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(wl.email.trim())) { setWl({ msg: 'Please enter a valid email.' }); return; }
        setWl({ busy: true, msg: '' });
        try {
          await hmPost('/api/waitlist', { country: wl.city, email: wl.email });
          this.setState({ wl: { city: '', email: '', busy: false, msg: 'Thank you! We’ll email you when we launch in your country.' } });
        } catch (err) { this.setState({ wl: Object.assign({}, wl, { busy: false, msg: err.message }) }); }
      }
    };
    return Object.assign(waitlist, {
      menuOpen: menu,
      menuClosed: !menu,
      menuExpanded: menu ? 'true' : 'false',
      menuLabel: menu ? 'Close menu' : 'Open menu',
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      closeMenu: () => this.setState({ menu: false }),
      showBea: this.props.showBea ?? false,
      showPricing: this.props.showPricing ?? false,
      price: price,
      priceLabel: money(price),
      onPrice: (e) => this.setState({ price: Number(e.target.value) }),
      freqs: opts.map((o) => {
        const on = o.id === current.id;
        return {
          label: o.label,
          pressed: on ? 'true' : 'false',
          bg: on ? '#2A2722' : '#FFFEFB',
          fg: on ? '#FBFAF7' : '#2A2722',
          border: on ? '#2A2722' : '#DDD5C8',
          pick: () => this.setState({ freq: o.id })
        };
      }),
      shareLabel: sharePct + '%',
      yearlyLabel: money(yearly),
      savedLabel: money(saved),
      netLabel: money(net)
    });
  }
}
window.Component = Component;
</script>
