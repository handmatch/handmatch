<body>
<div id="hm-root"></div>
<template id="hm-tpl">
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #2A2722; background: #FBFAF7; min-height: 100vh">

  <header style="padding: 20px 24px; border-bottom: 1px solid #ECE6DC">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2A2722">
        <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M8.5 22.5L24 10l15.5 12.5" fill="none" stroke="#2A2722" stroke-width="1.955" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="19" cy="24" r="3.4" fill="none" stroke="#2A2722" stroke-width="1.955"></circle><path d="M12.5 37.5c0-5 2.9-7.6 6.5-7.6s6.5 2.6 6.5 7.6" fill="none" stroke="#2A2722" stroke-width="1.955" stroke-linecap="round"></path><circle cx="29" cy="24" r="3.4" fill="none" stroke="#B39A6B" stroke-width="1.955"></circle><path d="M22.5 37.5c0-5 2.9-7.6 6.5-7.6s6.5 2.6 6.5 7.6" fill="none" stroke="#B39A6B" stroke-width="1.955" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.03em">handmatch</span>
      </a>
      <a href="/" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #2A2722; text-decoration: none; font-weight: 500; font-size: 16px">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to handmatch
      </a>
    </div>
  </header>

  <!-- Progress -->
  <div style="padding: 32px 24px 0">
    <ol aria-label="Steps" style="max-width: 1200px; margin: 0 auto; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 15px">
      <li><a href="/preferences" style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; color: #2A2722; text-decoration: none"><span style="width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #2A2722; color: #FFFFFF; font-size: 14px">1</span>Your preferences</a></li>
      <li aria-current="step" style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; color: #2A2722"><span style="width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #4F5D4C; color: #FFFFFF; font-size: 14px">2</span>Your matches</li>
      <li style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; color: #7A6E60"><span style="width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #C4BBAB; color: #FFFFFF; font-size: 14px">3</span>{{stepPay}}</li>
    </ol>
  </div>

  <section style="padding: 48px 24px 104px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 80px; align-items: flex-start">

      <!-- Applicants first -->
      <div style="flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
          <sc-for value="{{chips}}" as="c"><span style="padding: 8px 14px; border-radius: 999px; background: #F3EEE6; color: #3F3A33">{{c}}</span></sc-for>
          <a href="/preferences" style="display: inline-flex; align-items: center; padding: 8px 4px; font-size: 14px">Edit</a>
        </div>

        <!-- Matches: one featured helper, two locked -->
        <div style="display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px">
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #7E6A45">A real profile from our network</span>
            <span style="font-size: 14px; color: #6F6152">Your applicants are shared on your call with our team</span>
          </div>
          <ol aria-label="A featured helper profile and two locked matches" class="hm-pk">
            <li class="hm-pk-sample">
              <span style="position: absolute; top: 14px; left: 14px; padding: 4px 10px; border-radius: 999px; background: #DFF3E6; color: #1E7F47; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 999px; background: #22A35A"></span>I can start in 3 days</span>
              <div style="display: flex; align-items: center; gap: 16px; margin-top: 26px">
                <img src="/assets/img/cecile-v2.jpg" alt="Cecile P., housekeeper in Brooklyn" style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 999px; object-fit: cover; object-position: center; border: 4px solid #FFFFFF; box-shadow: 0 8px 20px rgba(42, 39, 34, 0.12); background: #DFE5DC">
                <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                  <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: -0.02em; color: #2A2722">Cecile P.</span>
                  <span style="font-size: 14px; color: #4A443C">Housekeeper · Brooklyn, NY</span>
                  <span style="font-size: 14px; color: #4A443C"><strong style="color: #2A2722">$21/hr</strong> · 4 years</span>
                </div>
              </div>
              <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #4A443C">Family-oriented mom of two who treats every client like family. Cooks Filipino food and loves cats.</p>
              <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3F3A33">
                <li style="display: flex; align-items: center; gap: 8px"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4F5D4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Interviewed by our team</li>
                <li style="display: flex; align-items: center; gap: 8px"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4F5D4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>References checked</li>
                <li style="display: flex; align-items: center; gap: 8px"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4F5D4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Cleaning · Laundry · Cooking · Pet &amp; child care</li>
              </ul>
              <a href="/profile-cecile" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; border: 1.5px solid #2A2722; color: #2A2722; text-decoration: none; font-weight: 600; font-size: 14px">View full profile →</a>
            </li>
            <li class="hm-pk-lock">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pick 2: shared on your call with our team</span>
              <div aria-hidden="true" style="position: relative; width: 100%; max-width: 120px; aspect-ratio: 1; border-radius: 999px; overflow: hidden; background: #F3EEE6; border: 4px solid #FFFFFF; box-shadow: 0 10px 24px rgba(42, 39, 34, 0.12); box-sizing: border-box">
                <img src="/assets/img/pick_mid.jpg" alt="" style="width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 30%; filter: blur(7px); transform: scale(1.3)">
                <span style="position: absolute; right: 8%; bottom: 8%; width: 28px; height: 28px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(42, 39, 34, 0.15)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A2722" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
              </div>
              <div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; filter: blur(4px); user-select: none">
                <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 17px; color: #2A2722">Grace L.</span>
                <span style="font-size: 13px; color: #6F6152">Cleaner · 96% match</span>
              </div>
              <span aria-hidden="true" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #F3EEE6; color: #6F6152; font-size: 12px; font-weight: 500">Unlocks after you pay</span>
            </li>
            <li class="hm-pk-lock">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pick 3: shared on your call with our team</span>
              <div aria-hidden="true" style="position: relative; width: 100%; max-width: 120px; aspect-ratio: 1; border-radius: 999px; overflow: hidden; background: #F3EEE6; border: 4px solid #FFFFFF; box-shadow: 0 10px 24px rgba(42, 39, 34, 0.12); box-sizing: border-box">
                <img src="/assets/img/pick3.jpg" alt="" style="width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 30%; filter: blur(7px); transform: scale(1.3)">
                <span style="position: absolute; right: 8%; bottom: 8%; width: 28px; height: 28px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(42, 39, 34, 0.15)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A2722" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
              </div>
              <div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; filter: blur(4px); user-select: none">
                <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 17px; color: #2A2722">Joy R.</span>
                <span style="font-size: 13px; color: #6F6152">Nanny · 94% match</span>
              </div>
              <span aria-hidden="true" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #F3EEE6; color: #6F6152; font-size: 12px; font-weight: 500">Unlocks after you pay</span>
            </li>
          </ol>
        </div>
      </div>

      <!-- Marv portrait -->
      <figure style="flex: 0 0 auto; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <img src="/assets/img/marvin-founder.jpg" alt="Marv" style="width: 168px; height: 168px; border-radius: 999px; object-fit: cover; flex-shrink: 0; background: #F3EEE6; border: 6px solid #FFFFFF; box-shadow: 0 10px 28px rgba(42, 39, 34, 0.12)">
        <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: -0.02em; color: #2A2722">Marv</span><span style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6F6152">Your handmatch advisor</span></figcaption>
      </figure>

      <!-- Message + call -->
      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 30px">
        <div style="display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: center; gap: 14px">
            <span aria-hidden="true" style="width: 40px; height: 1px; background: #CDBB98"></span>
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #7E6A45">A little surprise</span>
          </div>
          <h1 style="margin: 0; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: clamp(38px, 6vw, 67px); line-height: 0.98; letter-spacing: -0.025em">Meet Marv. <em style="font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; font-style: italic; color: #7E6A45">A real person, every step.</em></h1>
          <p style="margin: 0; max-width: 580px; font-size: 18px; font-weight: 300; line-height: 1.7; color: #4A443C">Marv makes sure your hire is a success. Once you’re in, our team reviews your account and contacts you personally to set up your first contact and interview with your applicants, and we’re with you every step of the way. <strong style="font-weight: 500; color: #2A2722">Your help can start in your home in as little as 3 days.</strong></p>
        </div>

        <!-- CTA -->
        <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="position: relative; overflow: hidden; background: #2A2722; color: #FBFAF7; border-radius: 28px; padding: clamp(26px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px">
          <div aria-hidden="true" style="position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 999px; background: radial-gradient(circle, rgba(205, 187, 152, 0.28), rgba(205, 187, 152, 0) 70%)"></div>
          <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
            <h2 style="margin: 0; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: clamp(28px, 4vw, 38px); line-height: 1.02; letter-spacing: -0.025em">Ready to meet <em style="font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; font-style: italic; color: #CDBB98">your three?</em></h2>
            <span style="font-size: 15px; color: #DDD5C8">Start in as little as 3 days</span>
          </div>

          <div style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
            <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: clamp(44px, 7vw, 56px); line-height: 0.9; letter-spacing: -0.03em">{{priceBig}}</span><span style="font-size: 15px; color: #DDD5C8">{{priceSub}}</span></span>
            <div role="group" aria-label="Number of hires" style="display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #3A3630">
              <button type="button" onClick="{{dec}}" aria-label="One fewer hire" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #FBFAF7; font-size: 20px; cursor: pointer">−</button>
              <span aria-live="polite" style="min-width: 64px; text-align: center; font-size: 15px; font-weight: 600">{{hireText}}</span>
              <button type="button" onClick="{{inc}}" aria-label="One more hire" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #FBFAF7; font-size: 20px; cursor: pointer">+</button>
            </div>
          </div>

          <ul style="position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #ECE6DC">
            <li style="display: flex; align-items: center; gap: 10px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#CDBB98" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>We set up your first interview</li>
            <li style="display: flex; align-items: center; gap: 10px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#CDBB98" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Up to 3 free replacements in 90 days</li>
            <li style="display: flex; align-items: center; gap: 10px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#CDBB98" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{tick3}}</li>
          </ul>

          <a href="{{payHref}}" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 999px; background: #CDBB98; color: #2A2722; text-decoration: none; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 18px">{{payBtn}}
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
        </div>

        <details class="hm-refund">
          <summary><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4F5D4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg><span style="flex: 1"><strong style="color: #2A2722">Fair refund policy</strong> · {{refundSummary}}</span><span class="hm-refund-x" aria-hidden="true">+</span></summary>
          <sc-if value="{{isA}}"><ul>
            <li><strong>Full refund</strong> if we can’t find a suitable match near you within 14 days, or if you cancel before we share your applicants.</li>
            <li><strong>50% refund</strong> if we’ve shared your applicants but you haven’t hired within 30 days.</li>
            <li><strong>After you hire</strong>, up to 3 free replacements within 90 days.</li>
          </ul></sc-if>
          <sc-if value="{{isB}}"><ul>
            <li><strong>Your {{depositLabel}} deposit is fully refunded</strong> if we can’t find a suitable match near you within 14 days, or if you cancel before we share your applicants.</li>
            <li><strong>The {{balanceLabel}} balance is only charged when you choose to hire.</strong> No hire, nothing more to pay.</li>
            <li><strong>After you hire</strong>, up to 3 free replacements within 90 days.</li>
          </ul></sc-if>
          <a href="/terms#refunds">Read the full refund policy</a>
        </details>
        </div>

        <!-- What happens next -->
        <ol aria-label="What happens next" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px">
          <li style="display: flex; flex-direction: column; gap: 8px; padding-top: 18px; border-top: 1px solid #DDD5C8">
            <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: #7E6A45; letter-spacing: -0.02em">I.</span>
            <span style="font-weight: 500; font-size: 16px">{{step1}}</span>
            <span style="font-size: 14px; line-height: 1.6; color: #6F6152">Our team reviews your account and contacts you personally.</span>
          </li>
          <li style="display: flex; flex-direction: column; gap: 8px; padding-top: 18px; border-top: 1px solid #DDD5C8">

<script>window.HM_PROPS = {};</script>
<script src="/assets/hm-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hires: 1 };
  }
  componentDidMount() { window.addEventListener('hm-variant', () => this.setState({})); }
  renderVals() {
    // A/B test: B = "Meet first, pay when you hire" ($49 deposit now, $300 when you hire)
    const isB = window.HM_VARIANT === 'B';
    const n = this.state.hires, fee = isB ? 49 : 349, balance = 300, max = 5;
    const p = hmStore.get('prefs') || {};
    const chips = [p.help_type || 'Regular home cleaning'];
    if (p.days && p.days.length) chips.push(p.days.join(' & '));
    chips.push('$' + (p.budget_per_hour || 18) + ' per hour');
    if (p.location) chips.push(p.location);
    return {
      chips: chips,
      payHref: '/pay?hires=' + n,
      hires: n,
      hireText: n === 1 ? '1 hire' : n + ' hires',
      totalLabel: '$' + (fee * n).toLocaleString('en-US'),
      isA: !isB, isB: isB, depositLabel: '$' + fee, balanceLabel: '$' + balance,
      stepPay: isB ? 'Pay $' + fee + ' deposit' : 'Pay one-time fee',
      priceBig: '$' + fee,
      priceSub: isB ? 'deposit per hire today · $' + balance + ' more only when you hire' : 'one-time, per hire',
      tick3: isB ? 'Pay the rest only if you hire' : 'No subscription, no monthly fees',
      payBtn: isB ? 'Start for $' + (fee * n).toLocaleString('en-US') : 'Pay $' + (fee * n).toLocaleString('en-US'),
      refundSummary: isB ? 'Pay the rest only when you hire' : 'Full refund if we can’t find your match',
      step1: isB ? 'Pay the $' + fee + ' deposit' : 'Pay now',
      step3: isB ? 'Pay the $' + balance + ' balance only when you hire. Help can start in as little as 3 days.' : 'Your help can start in as little as 3 days.',
      decOpacity: n > 1 ? 1 : 0.35,
      incOpacity: n < max ? 1 : 0.35,
      dec: () => this.setState({ hires: Math.max(1, n - 1) }),
      inc: () => this.setState({ hires: Math.min(max, n + 1) })
    };
  }
}
window.Component = Component;
</script>
