<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account · handmatch</title>
<meta name="description" content="Your handmatch account.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Your account · handmatch">
<meta property="og:description" content="Your handmatch account.">
<meta property="og:image" content="/assets/img/fb-profile-1080.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/img/fb-profile-1080.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBFAF7}
a{color:#4F5D4C}a:hover{color:#3D4A3B}
.pg{font-family:'DM Sans',system-ui,sans-serif;color:#2A2722;background:#FBFAF7;min-height:100vh}
.top{padding:16px 24px;border-bottom:1px solid #ECE6DC;background:#FBFAF7}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#2A2722}
.logo img{border-radius:8px}
.logo span{font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:-.03em}
.muted-link{color:#4A443C;font-size:15px}
.who{display:flex;align-items:center;gap:12px;font-size:14px;color:#4A443C}
.role-pill{padding:4px 10px;border-radius:999px;background:#F3EEE6;color:#7E6A45;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 96px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#7E6A45}
.h1{margin:0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:clamp(30px,5vw,44px);line-height:1.02;letter-spacing:-.03em}
.h1 em,.h2 em{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;color:#7E6A45;letter-spacing:-.01em}
.h2{margin:0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:-.02em}
.h3{margin:0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em}
.lead{margin:0;font-size:17px;line-height:1.6;color:#4A443C}
.small{margin:0;font-size:14px;line-height:1.55;color:#6F6152}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:#FFFFFF;border:1px solid #ECE6DC;border-radius:22px;padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.dark{background:#2A2722;border-color:#2A2722;color:#FBFAF7}
.lbl{font-size:14px;font-weight:600;color:#2A2722}
.inp,.sel,.txt{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid #DDD5C8;font:inherit;font-size:16px;color:#2A2722;background:#FFFFFF}
.txt{padding:12px 14px;min-height:96px;line-height:1.5;resize:vertical}
.inp:focus,.sel:focus,.txt:focus{outline:2px solid #4F5D4C;outline-offset:1px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:#2A2722;color:#FBFAF7;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn.gold{background:#CDBB98;color:#2A2722}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid #DDD5C8;background:transparent;color:#2A2722;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn-ghost.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:wait}
.err{margin:0;font-size:14px;color:#B45309}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#F3EEE6;color:#4A443C;font-size:12px;font-weight:600;white-space:nowrap}
.pill.green{background:#DFF3E6;color:#1E7F47}
.pill.amber{background:#FDF0DC;color:#9A5B0B}
.pill.dark{background:#2A2722;color:#FBFAF7}
.pill.grey{background:#ECE6DC;color:#6F6152}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;background:#F3EEE6;color:#3F3A33;font-size:13px}
.tog{padding:8px 14px;border-radius:999px;border:1.5px solid #DDD5C8;background:#FFFFFF;color:#3F3A33;font:inherit;font-size:14px;cursor:pointer}
.tog.on{background:#2A2722;border-color:#2A2722;color:#FBFAF7}
.avatar{width:56px;height:56px;flex-shrink:0;border-radius:999px;object-fit:cover;background:#DFE5DC;color:#3D4A3B;display:flex;align-items:center;justify-content:center;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:20px;border:3px solid #FFFFFF;box-shadow:0 6px 16px rgba(42,39,34,.12)}
.avatar.lg{width:72px;height:72px;font-size:24px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#3F3A33}
.checks li{display:flex;align-items:center;gap:8px}
.ck{width:18px;height:18px;flex-shrink:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:#4F5D4C}
.ck.no{background:#ECE6DC}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.step{padding:14px;border-radius:16px;background:#F3EEE6;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#6F6152}
.step b{font-family:'Instrument Sans',sans-serif;font-size:15px;color:#2A2722;font-weight:600}
.step.done{background:#DFE5DC;color:#3D4A3B}
.step.active{background:#2A2722;color:#DDD5C8}
.step.active b{color:#FBFAF7}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:flex;gap:12px;font-size:14px;line-height:1.5;color:#3F3A33}
.tl .dot{width:10px;height:10px;margin-top:6px;flex-shrink:0;border-radius:999px;background:#B39A6B}
.tl time{display:block;font-size:12px;color:#8A7F70}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #ECE6DC;padding-bottom:10px}
.tab{padding:10px 16px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;color:#6F6152;cursor:pointer}
.tab.on{background:#2A2722;color:#FBFAF7}
.split{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow:auto;padding-right:4px}
.item{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid #ECE6DC;background:#FFFFFF;font:inherit;color:#2A2722;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.item.on{border-color:#2A2722;box-shadow:0 8px 20px rgba(42,39,34,.08)}
.item small{color:#6F6152;font-size:13px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:#6F6152}.kv dd{margin:0;color:#2A2722}
.line{border:0;border-top:1px solid #ECE6DC;margin:4px 0;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:999px;background:#2A2722;color:#FBFAF7;font-size:14px;box-shadow:0 12px 30px rgba(42,39,34,.25)}
.toast.bad{background:#9A3412}
.lgm{max-width:520px;margin:0 auto;padding:56px 24px 96px;display:flex;flex-direction:column;gap:20px}
.lg-card{background:#FFFFFF;border:1px solid #ECE6DC;border-radius:28px;padding:clamp(24px,5vw,40px);box-shadow:0 20px 50px rgba(42,39,34,.06)}
.ok-ic{width:56px;height:56px;border-radius:999px;background:#4F5D4C;display:flex;align-items:center;justify-content:center}
.empty{padding:24px;border-radius:18px;border:1.5px dashed #DDD5C8;color:#6F6152;font-size:15px;line-height:1.6;text-align:center}
.applink{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(140px,.9fr) minmax(180px,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #F0EBE2}
.checkrow{display:flex;align-items:center;gap:8px;font-size:15px}
.checkrow input{width:18px;height:18px;accent-color:#4F5D4C}
@media (max-width:900px){.split{grid-template-columns:1fr}.list{max-height:none}.applink{grid-template-columns:1fr 1fr}.kv{grid-template-columns:110px 1fr}}
.split.rev{grid-template-columns:minmax(0,1fr) minmax(260px,340px)}
@media (max-width:900px){.split.rev{grid-template-columns:1fr}.split.rev>:last-child{order:-1}}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="hm-root"></div>
<template id="hm-tpl">
<div class="pg">
  <header class="top"><div class="top-in">
    <a href="/" class="logo"><img src="/favicon.svg" alt="" width="30" height="30"><span>handmatch</span></a>
    <sc-if value="{{hasMe}}">
      <div class="who"><span class="role-pill">{{roleLabel}}</span><span>{{meName}}</span><button type="button" class="btn-ghost sm" onClick="{{onLogout}}">Sign out</button></div>
    </sc-if>
  </div></header>

  <sc-if value="{{loading}}"><main class="wrap"><p class="small">Loading your account…</p></main></sc-if>
  <sc-if value="{{loadError}}"><main class="wrap"><div class="card"><h2 class="h2">We couldn’t load your account</h2><p class="small">{{loadError}}</p><div><button type="button" class="btn" onClick="{{onReload}}">Try again</button></div></div></main></sc-if>

  <!-- ===================== FAMILY ===================== -->
  <sc-if value="{{isFamily}}">
  <main class="wrap">
    <div class="stack" style="gap:8px">
      <span class="eyebrow">Your hire</span>
      <h1 class="h1">Hi {{meFirst}}. <em>A real person, every step.</em></h1>
    </div>
    <sc-if value="{{famNoCases}}"><div class="empty">We’re setting up your account. If you just paid, this can take a minute. Questions? Email <a href="mailto:hello.handmatch@gmail.com">hello.handmatch@gmail.com</a> or call <a href="tel:+16466612206">+1 (646) 661-2206</a>.</div></sc-if>
    <sc-for value="{{famCases}}" as="c">
      <div class="split rev">
        <div class="stack">
          <div class="card">
            <div class="row between"><h2 class="h2">Your progress</h2><sc-if value="{{c.orderRef}}"><span class="pill">Order {{c.orderRef}}</span></sc-if></div>
            <ol class="steps"><sc-for value="{{c.steps}}" as="st"><li class="{{st.cls}}"><span>Step {{st.n}}</span><b>{{st.title}}</b><span>{{st.sub}}</span></li></sc-for></ol>
          </div>
          <div class="card">
            <h2 class="h2">Your applicants</h2>
            <sc-if value="{{c.noApplicants}}"><div class="empty">Your coordinator is matching applicants who fit your home. They’ll appear here, ready to start in as little as 3 days.</div></sc-if>
            <sc-for value="{{c.applicants}}" as="a">
              <div class="card" style="background:#FBFAF7">
                <div class="row" style="align-items:flex-start;gap:14px">
                  <sc-if value="{{a.hasPhoto}}"><img class="avatar lg" src="{{a.photo_url}}" alt="{{a.name}}"></sc-if>
                  <sc-if value="{{a.noPhoto}}"><span class="avatar lg" aria-hidden="true">{{a.initial}}</span></sc-if>
                  <div class="stack" style="gap:4px;flex:1;min-width:0">
                    <div class="row between"><h3 class="h2">{{a.name}}</h3><span class="{{a.statusCls}}">{{a.statusLabel}}</span></div>
                    <span class="small">{{a.roleLine}}</span>
                    <sc-if value="{{a.rateLine}}"><span class="small"><strong style="color:#2A2722">{{a.rateLine}}</strong></span></sc-if>
                    <sc-if value="{{a.startLine}}"><span class="pill green" style="align-self:flex-start">{{a.startLine}}</span></sc-if>
                  </div>
                </div>
                <sc-if value="{{a.bio}}"><p class="small">{{a.bio}}</p></sc-if>
                <sc-if value="{{a.hasSkills}}"><div class="chips"><sc-for value="{{a.skills}}" as="sk"><span class="chip">{{sk}}</span></sc-for></div></sc-if>
                <sc-if value="{{a.daysLine}}"><span class="small">Available {{a.daysLine}}</span></sc-if>
                <ul class="checks"><sc-for value="{{a.checks}}" as="ck"><li><span class="{{ck.cls}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{ck.label}}</li></sc-for></ul>
              </div>
            </sc-for>
          </div>
          <div class="card">
            <h2 class="h2">Not the right fit?</h2>
            <p class="small">Tell your coordinator what you’re looking for and we’ll find someone new. Up to 3 replacements within 90 days are included.</p>
            <textarea class="txt" placeholder="Optional: what would make a better match?" value="{{c.changeNote}}" onChange="{{c.onChangeNote}}"></textarea>
            <div><button type="button" class="btn-ghost" onClick="{{c.onRequestChange}}">Ask for a different applicant</button></div>
          </div>
        </div>
        <div class="stack">
          <sc-if value="{{c.coord}}">
            <div class="card dark">
              <span class="eyebrow" style="color:#CDBB98">Your dedicated coordinator</span>
              <div class="row" style="gap:14px">
                <sc-if value="{{c.coord.hasPhoto}}"><img class="avatar lg" src="{{c.coord.photo_url}}" alt="{{c.coord.name}}"></sc-if>
                <sc-if value="{{c.coord.noPhoto}}"><span class="avatar lg" aria-hidden="true">{{c.coord.initial}}</span></sc-if>
                <div class="stack" style="gap:2px"><h3 class="h2" style="color:#FBFAF7">{{c.coord.name}}</h3><span class="small" style="color:#DDD5C8">Checks in with you at every step</span></div>
              </div>
              <div class="row">
                <sc-if value="{{c.coord.tel}}"><a class="btn gold sm" href="{{c.coord.tel}}">Call</a></sc-if>
                <a class="btn-ghost sm" style="color:#FBFAF7;border-color:#5A554D" href="{{c.coord.mailto}}">Email</a>
              </div>
            </div>
          </sc-if>
          <div class="card">
            <h2 class="h2">Updates</h2>
            <ul class="tl"><sc-for value="{{c.events}}" as="ev"><li><span class="dot" aria-hidden="true"></span><span>{{ev.body}}<time>{{ev.when}}</time></span></li></sc-for></ul>
          </div>
        </div>
      </div>
    </sc-for>
  </main>
  </sc-if>

  <!-- ===================== APPLICANT ===================== -->
  <sc-if value="{{isApplicant}}">
  <main class="wrap">
    <div class="stack" style="gap:8px">
      <span class="eyebrow">Your handmatch profile</span>
      <h1 class="h1">Hi {{meFirst}}. <em>Let’s find your next family.</em></h1>
    </div>
    <div class="card" style="background:#F3EEE6;border-color:#F3EEE6">
      <div class="row between"><h2 class="h3">{{apBannerTitle}}</h2><span class="{{apStatusCls}}">{{apStatusLabel}}</span></div>
      <p class="small">{{apBannerText}}</p>
    </div>
    <div class="card">
      <h2 class="h2">Interview requests</h2>
      <sc-if value="{{apNoRequests}}"><div class="empty">No requests yet. When we match you with a family, it shows up here and we email you.</div></sc-if>
      <sc-for value="{{apRequests}}" as="r">
        <div class="card" style="background:#FBFAF7">
          <div class="row between"><h3 class="h3">{{r.title}}</h3><span class="{{r.statusCls}}">{{r.statusLabel}}</span></div>
          <span class="small">{{r.sub}}</span>
          <sc-if value="{{r.canRespond}}"><div class="row"><button type="button" class="btn sm" onClick="{{r.onAccept}}">I’m available</button><button type="button" class="btn-ghost sm" onClick="{{r.onDecline}}">Not this time</button></div></sc-if>
        </div>
      </sc-for>
    </div>
    <div class="split rev">
      <form class="card" onSubmit="{{onSaveProfile}}">
        <h2 class="h2">Your profile</h2>
        <p class="small">Families see your first name and last initial, your area, experience, skills and availability. Never your email, phone or documents.</p>
        <div class="grid2">
          <div class="field"><label class="lbl" for="pf-name">Full name</label><input id="pf-name" class="inp" autocomplete="name" value="{{pf.full_name}}" onChange="{{pfSet.full_name}}"></div>
          <div class="field"><label class="lbl" for="pf-phone">Mobile</label><input id="pf-phone" class="inp" type="tel" autocomplete="tel" value="{{pf.phone}}" onChange="{{pfSet.phone}}"></div>
          <div class="field"><label class="lbl" for="pf-role">Type of work</label><select id="pf-role" class="sel" value="{{pf.role_type}}" onChange="{{pfSet.role_type}}"><option value="cleaner">House cleaner</option><option value="housekeeper">Housekeeper</option><option value="nanny">Nanny</option></select></div>
          <div class="field"><label class="lbl" for="pf-emp">Part-time or full-time</label><select id="pf-emp" class="sel" value="{{pf.employment}}" onChange="{{pfSet.employment}}"><option>Part-time or full-time</option><option>Part-time</option><option>Full-time</option></select></div>
          <div class="field"><label class="lbl" for="pf-zip">ZIP code</label><input id="pf-zip" class="inp" inputmode="numeric" maxlength="5" value="{{pf.zip}}" onChange="{{pfSet.zip}}"></div>
          <div class="field"><label class="lbl" for="pf-city">Neighborhood or city</label><input id="pf-city" class="inp" placeholder="e.g. Brooklyn, NY" value="{{pf.city}}" onChange="{{pfSet.city}}"></div>
          <div class="field"><label class="lbl" for="pf-rate">Hourly rate ($)</label><input id="pf-rate" class="inp" type="number" min="0" step="1" value="{{pf.rate}}" onChange="{{pfSet.rate}}"></div>
          <div class="field"><label class="lbl" for="pf-years">Years of experience</label><input id="pf-years" class="inp" type="number" min="0" step="1" value="{{pf.years}}" onChange="{{pfSet.years}}"></div>
          <div class="field"><label class="lbl" for="pf-start">Can start in (days)</label><input id="pf-start" class="inp" type="number" min="0" step="1" value="{{pf.start_in_days}}" onChange="{{pfSet.start_in_days}}"></div>
          <div class="field"><label class="lbl" for="pf-lang">Languages</label><input id="pf-lang" class="inp" placeholder="English, Tagalog" value="{{pf.languages}}" onChange="{{pfSet.languages}}"></div>
        </div>
        <div class="field"><span class="lbl">Skills</span><div class="chips"><sc-for value="{{pfSkills}}" as="t"><button type="button" class="{{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}">{{t.label}}</button></sc-for></div></div>
        <div class="field"><span class="lbl">Days you can work</span><div class="chips"><sc-for value="{{pfDays}}" as="t"><button type="button" class="{{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}">{{t.label}}</button></sc-for></div></div>
        <div class="field"><label class="lbl" for="pf-hours">Usual hours</label><input id="pf-hours" class="inp" placeholder="e.g. 8 AM to 4 PM" value="{{pf.hours}}" onChange="{{pfSet.hours}}"></div>
        <div class="field"><label class="lbl" for="pf-bio">About you</label><textarea id="pf-bio" class="txt" placeholder="Your experience, what you’re great at, and what families love about you." value="{{pf.bio}}" onChange="{{pfSet.bio}}"></textarea></div>
        <div class="row"><button type="submit" class="btn">{{saveLabel}}</button><sc-if value="{{canSubmit}}"><button type="button" class="btn gold" onClick="{{onSubmitProfile}}">Submit for review</button></sc-if></div>
      </form>
      <div class="stack">
        <div class="card">
          <h2 class="h2">Checks</h2>
          <p class="small">Completed by the handmatch team after your interview.</p>
          <ul class="checks"><sc-for value="{{apChecks}}" as="ck"><li><span class="{{ck.cls}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{ck.label}}</li></sc-for></ul>
        </div>
        <div class="card"><h2 class="h3">Questions?</h2><p class="small">Email <a href="mailto:hello.handmatch@gmail.com">hello.handmatch@gmail.com</a> or call <a href="tel:+16466612206">+1 (646) 661-2206</a>. Helpers never pay handmatch to find work.</p></div>
      </div>
    </div>
  </main>
  </sc-if>

<script>window.HM_PROPS = {};</script>

<script>
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SKILLS = ['Regular cleaning', 'Deep cleaning', 'Laundry', 'Cooking', 'Organizing', 'Pet care', 'Child care', 'Elder care', 'Errands'];
const CASE_LABEL = { new: 'New', contacted: 'Contacted', interviewing: 'Interviewing', hired: 'Hired', replacement: 'Replacement', closed: 'Closed' };
const CASE_CLS = { new: 'pill amber', contacted: 'pill', interviewing: 'pill', hired: 'pill green', replacement: 'pill amber', closed: 'pill grey' };
const LINK_LABEL = { proposed: 'Waiting for applicant to confirm', accepted: 'Accepted · ready to interview', declined: 'Declined', interview: 'Interview set', hired: 'Hired', not_selected: 'Not selected', removed: 'Removed' };
const FAM_LINK = { proposed: ['Confirming availability', 'pill'], accepted: ['Ready to interview', 'pill green'], interview: ['Interview set', 'pill dark'], hired: ['Hired', 'pill green'] };
const REQ_LINK = { proposed: ['New request', 'pill amber'], accepted: ['You’re available', 'pill green'], declined: ['You declined', 'pill grey'], interview: ['Interview set', 'pill dark'], hired: ['Hired', 'pill green'], not_selected: ['Not selected this time', 'pill grey'] };
const PROFILE_LABEL = { draft: 'Draft', submitted: 'In review', active: 'Active', paused: 'Paused' };
const PROFILE_CLS = { draft: 'pill amber', submitted: 'pill', active: 'pill green', paused: 'pill grey' };
const ROLE_LABEL = { cleaner: 'House cleaner', housekeeper: 'Housekeeper', nanny: 'Nanny', family: 'Family', applicant: 'Applicant', coordinator: 'Coordinator' };
const BG_LABEL = { not_started: 'Background check before starting', pending: 'Background check in progress', clear: 'Background check clear' };
const BANNER = {
  draft: ['Finish your profile', 'Fill in your details and tap Submit for review. Our team will reach out for a short interview.'],
  submitted: ['Thanks! Your profile is in review', 'Our team will reach out for a short interview. You can keep updating your profile.'],
  active: ['Your profile is active', 'We can match you with families near you. Keep your availability up to date.'],
  paused: ['Your profile is paused', 'Families can’t be matched with you right now. Contact us to turn it back on.']
};

const fmt = (iso) => (iso ? new Date(iso).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');
const fmtDay = (iso) => (iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '');
const TZ = 'America/New_York';
function tzOffsetMs(utcMs) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date(utcMs)).map((p) => [p.type, p.value]));
  return Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second) - utcMs;
}
// Interview times are entered and shown in New York time, wherever the coordinator is.
const etInputToIso = (v) => { const [d, t] = v.split('T'); const [y, m, da] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); const guess = Date.UTC(y, m - 1, da, h, mi); return new Date(guess - tzOffsetMs(guess)).toISOString(); };
const isoToEtInput = (iso) => { if (!iso) return ''; const ms = new Date(iso).getTime(); return new Date(ms + tzOffsetMs(ms)).toISOString().slice(0, 16); };
const fmtET = (iso) => (iso ? new Date(iso).toLocaleString('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ET' : '');
const toLocal = (iso) => { if (!iso) return ''; const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const initial = (n) => (String(n || '?').trim()[0] || '?').toUpperCase();
const firstName = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const join = (a) => (Array.isArray(a) ? a.join(', ') : String(a || ''));
const str = (v) => (v == null ? '' : String(v));
const checkList = (c) => [
  ['Interviewed by our team', c.interview], ['Identity confirmed', c.id], ['References checked', c.references],
  [BG_LABEL[c.background] || BG_LABEL.not_started, c.background === 'clear']
].map(([label, ok]) => ({ label: label, cls: ok ? 'ck' : 'ck no' }));

function famSteps(status) {
  const stage = { new: 1, contacted: 2, interviewing: 2, replacement: 2, hired: 4, closed: 5 }[status] || 1;
  return [
    ['Payment confirmed', 'Welcome to handmatch'],
    ['Your coordinator calls', 'To get to know your home'],
    ['Meet and interview', 'We set up your first contact'],
    ['Hire directly', 'Agree pay and schedule together'],
    ['First-week check-in', 'We make sure it’s working']
  ].map((x, i) => ({ n: i + 1, title: x[0], sub: x[1], cls: 'step' + (i < stage ? ' done' : i === stage ? ' active' : '') }));
}

async function api(action, body) {
  const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  const r = await fetch('/api/app?action=' + action, opts);
  let j = {};
  try { j = await r.json(); } catch (e) { /* empty */ }
  if (r.status === 401) { location.href = '/login'; throw new Error('Please sign in.'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loading: true, loadError: '', data: null, d: {}, busy: false, toast: '', toastBad: false,
      tab: 'cases', selCase: '', selApp: '', caseQuery: '', caseFilter: 'open', appQuery: '', appFilter: 'all' };
  }
  componentDidMount() { this.load(); }
  load() {
    this.setState({ loading: true, loadError: '' });
    api('dashboard').then((data) => this.setState({ data: data, loading: false }))
      .catch((err) => this.setState({ loading: false, loadError: err.message }));
  }
  toast(msg, bad) {
    this.setState({ toast: msg, toastBad: !!bad });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 3400);
  }
  act(action, body, msg, clear) {
    if (this.state.busy) return;
    this.setState({ busy: true });
    api(action, body).then((data) => {
      const d = Object.assign({}, this.state.d);
      (clear || []).forEach((k) => delete d[k]);
      this.setState({ data: data, d: d, busy: false });
      this.toast(msg || 'Saved');
    }).catch((err) => { this.setState({ busy: false }); this.toast(err.message, true); });
  }
  draft(key, base) { return Object.assign({}, base, this.state.d[key] || {}); }
  setD(key, field, value) {
    const d = Object.assign({}, this.state.d);
    d[key] = Object.assign({}, d[key] || {}, { [field]: value });
    this.setState({ d: d });
  }
  setters(key, fields) {
    const o = {};
    fields.forEach((f) => { o[f] = (e) => this.setD(key, f, e.target.value); });
    return o;
  }

  renderVals() {
    const s = this.state;
    const data = s.data;
    const me = data ? data.me : null;
    const base = {
      loading: s.loading, loadError: s.loadError, hasMe: !!me,
      roleLabel: me ? ROLE_LABEL[me.role] : '', meName: me ? (me.full_name || me.email) : '', meFirst: me ? (firstName(me.full_name) || 'there') : '',
      isFamily: !!(me && me.role === 'family' && !s.loading), isApplicant: !!(me && me.role === 'applicant' && !s.loading), isCoord: !!(me && me.role === 'coordinator' && !s.loading),
      toast: s.toast, toastCls: s.toastBad ? 'toast bad' : 'toast',
      onReload: () => this.load(),
      onLogout: () => hmPost('/api/auth?action=logout').catch(() => {}).then(() => { location.href = '/login'; })
    };
    if (!me || s.loading) return base;
    if (me.role === 'family') return Object.assign(base, this.familyVals(data));
    if (me.role === 'applicant') return Object.assign(base, this.applicantVals(data));
    return Object.assign(base, this.coordVals(data));
  }

  // ---------------- family
  familyVals(data) {
    const cases = data.cases || [];
    return {
      famNoCases: !cases.length,
      famCases: cases.map((c) => {
        const key = 'chg:' + c.id;
        const dr = this.draft(key, { note: '' });
        const co = c.coordinator;
        return {
          orderRef: c.order_ref, steps: famSteps(c.status),
          noApplicants: !c.applicants.length,
          applicants: c.applicants.map((a) => {
            const st = FAM_LINK[a.status] || ['', 'pill'];
            return {
              name: a.name, photo_url: a.photo_url, hasPhoto: !!a.photo_url, noPhoto: !a.photo_url, initial: initial(a.name),
              statusLabel: a.status === 'interview' && a.interview_at ? 'Interview ' + fmt(a.interview_at) : st[0], statusCls: st[1],
              roleLine: [ROLE_LABEL[a.role_type], a.city].filter(Boolean).join(' · '),
              rateLine: [a.rate != null ? '$' + Number(a.rate) + '/hr' : '', a.years != null ? a.years + (a.years === 1 ? ' year' : ' years') + ' of experience' : '', a.employment].filter(Boolean).join(' · '),
              startLine: a.start_in_days != null ? (a.start_in_days <= 0 ? 'Can start right away' : 'Can start in ' + a.start_in_days + (a.start_in_days === 1 ? ' day' : ' days')) : '',
              bio: a.bio, skills: a.skills, hasSkills: !!(a.skills && a.skills.length),
              daysLine: (a.days || []).join(', ') + (a.hours ? ' · ' + a.hours : ''),
              checks: checkList(a.checks)
            };
          }),
          coord: co ? { name: co.name, photo_url: co.photo_url, hasPhoto: !!co.photo_url, noPhoto: !co.photo_url, initial: initial(co.name), tel: co.phone ? 'tel:' + co.phone.replace(/[^\d+]/g, '') : '', mailto: 'mailto:' + co.email } : null,
          events: c.events.map((e) => ({ body: e.body, when: fmt(e.created_at) })),
          changeNote: dr.note,
          onChangeNote: (e) => this.setD(key, 'note', e.target.value),
          onRequestChange: () => this.act('request_change', { case_id: c.id, note: dr.note }, 'Sent to your coordinator', [key])
        };
      })
    };
  }

  // ---------------- applicant
  applicantVals(data) {
    const p = data.profile || {};
    const me = data.me;
    const key = 'pf';
    const pf = this.draft(key, {
      full_name: me.full_name || '', phone: me.phone || '', role_type: p.role_type || 'housekeeper', employment: p.employment || 'Part-time or full-time',
      zip: str(p.zip), city: str(p.city), rate: str(p.rate), years: str(p.years), start_in_days: str(p.start_in_days),
      languages: join(p.languages), hours: str(p.hours), bio: str(p.bio), skills: p.skills || [], days: p.days || []
    });
    const toggle = (field, value) => () => {
      const list = (this.draft(key, pf)[field] || []).slice();
      const i = list.indexOf(value);
      if (i >= 0) list.splice(i, 1); else list.push(value);
      this.setD(key, field, list);
    };
    const status = p.status || 'draft';
    const body = (submit) => Object.assign({}, pf, { submit: !!submit });
    return {
      pf: pf,
      pfSet: this.setters(key, ['full_name', 'phone', 'role_type', 'employment', 'zip', 'city', 'rate', 'years', 'start_in_days', 'languages', 'hours', 'bio']),
      pfSkills: SKILLS.concat((pf.skills || []).filter((x) => SKILLS.indexOf(x) < 0)).map((x) => ({ label: x, cls: pf.skills.indexOf(x) >= 0 ? 'tog on' : 'tog', pressed: pf.skills.indexOf(x) >= 0 ? 'true' : 'false', toggle: toggle('skills', x) })),
      pfDays: DAYS.map((x) => ({ label: x, cls: pf.days.indexOf(x) >= 0 ? 'tog on' : 'tog', pressed: pf.days.indexOf(x) >= 0 ? 'true' : 'false', toggle: toggle('days', x) })),
      saveLabel: this.state.busy ? 'Saving…' : 'Save profile',
      canSubmit: status === 'draft' || status === 'paused',
      onSaveProfile: (e) => { e.preventDefault(); this.act('save_profile', body(false), 'Profile saved', [key]); },
      onSubmitProfile: () => this.act('save_profile', body(true), 'Submitted for review. We’ll be in touch!', [key]),
      apStatusLabel: PROFILE_LABEL[status], apStatusCls: PROFILE_CLS[status],
      apBannerTitle: (BANNER[status] || BANNER.draft)[0], apBannerText: (BANNER[status] || BANNER.draft)[1],
      apChecks: checkList({ interview: p.check_interview, id: p.check_id, references: p.check_references, background: p.check_background }),
      apNoRequests: !(data.requests || []).length,
      apRequests: (data.requests || []).map((r) => {
        const st = REQ_LINK[r.status] || [r.status, 'pill'];
        return {
          title: r.family_first + ' · ' + (r.help_type || 'Home help'),
          sub: ['ZIP ' + (r.zip || '—'), r.interview_at ? 'Interview ' + fmt(r.interview_at) : 'Sent ' + fmtDay(r.created_at)].join(' · '),
          statusLabel: st[0], statusCls: st[1], canRespond: r.status === 'proposed',
          onAccept: () => this.act('respond', { id: r.id, accept: true }, 'Thanks! Your coordinator will set up the interview.'),
          onDecline: () => this.act('respond', { id: r.id, accept: false }, 'Got it. We’ll keep you in mind for the next one.')
        };
      })
    };
  }

  // ---------------- coordinator
  coordVals(data) {
    const s = this.state;
    const cases = data.cases || [];
    const apps = data.applicants || [];
    const coords = data.coordinators || [];
    const appById = Object.fromEntries(apps.map((a) => [a.user_id, a]));
    const open = cases.filter((c) => c.status !== 'closed').length;
    const review = apps.filter((a) => a.status === 'submitted').length;
    const tabs = [['cases', 'Cases (' + cases.length + ')'], ['applicants', 'Applicants (' + apps.length + ')'], ['team', 'Team & invites']];

    const q = s.caseQuery.trim().toLowerCase();
    const filtered = cases.filter((c) => (s.caseFilter === 'all' || (s.caseFilter === 'open' ? c.status !== 'closed' : c.status === s.caseFilter)))
      .filter((c) => !q || [c.family.name, c.family.email, c.zip, c.order.ref].join(' ').toLowerCase().indexOf(q) >= 0);
    const selCase = cases.find((c) => c.id === s.selCase) || null;

    const aq = s.appQuery.trim().toLowerCase();
    const appFiltered = apps.filter((a) => s.appFilter === 'all' || a.status === s.appFilter)
      .filter((a) => !aq || [a.full_name, a.email, a.zip, a.city].join(' ').toLowerCase().indexOf(aq) >= 0);
    const selApp = apps.find((a) => a.user_id === s.selApp) || null;

    const out = {
      coSummary: open + (open === 1 ? ' open case' : ' open cases') + (review ? ' · ' + review + ' to review' : ''),
      coTabs: tabs.map(([id, label]) => ({ label: label, cls: s.tab === id ? 'tab on' : 'tab', go: () => this.setState({ tab: id }) })),
      tabCases: s.tab === 'cases', tabApplicants: s.tab === 'applicants', tabTeam: s.tab === 'team',
      onSync: () => this.act('sync_orders', {}, 'Paid orders imported'),
      caseQuery: s.caseQuery, caseFilter: s.caseFilter,
      onCaseQuery: (e) => this.setState({ caseQuery: e.target.value }),
      onCaseFilter: (e) => this.setState({ caseFilter: e.target.value }),
      noCases: !filtered.length,
      caseList: filtered.map((c) => ({
        name: c.family.name || c.family.email, cls: selCase && selCase.id === c.id ? 'item on' : 'item',
        statusLabel: CASE_LABEL[c.status] || c.status, statusCls: CASE_CLS[c.status] || 'pill',
        sub: [c.help_type, c.zip ? 'ZIP ' + c.zip : '', c.applicants.length + (c.applicants.length === 1 ? ' applicant' : ' applicants'), fmtDay(c.created_at)].filter(Boolean).join(' · '),
        pick: () => { this.setState({ selCase: c.id }); setTimeout(() => { const el = document.getElementById('case-detail'); if (el && window.innerWidth < 900) el.scrollIntoView({ behavior: 'smooth' }); }, 50); }
      })),
      coordOptions: coords.map((o) => ({ id: o.id, label: o.full_name || o.email })),
      noSel: !selCase, sel: selCase ? this.caseVals(selCase, apps, appById) : null,
      appQuery: s.appQuery, appFilter: s.appFilter,
      onAppQuery: (e) => this.setState({ appQuery: e.target.value }),
      onAppFilter: (e) => this.setState({ appFilter: e.target.value }),
      noApps: !appFiltered.length,
      appList: appFiltered.map((a) => ({
        name: a.full_name || a.email, cls: selApp && selApp.user_id === a.user_id ? 'item on' : 'item',
        statusLabel: PROFILE_LABEL[a.status] || a.status, statusCls: PROFILE_CLS[a.status] || 'pill',
        sub: [ROLE_LABEL[a.role_type], a.zip ? 'ZIP ' + a.zip : '', a.rate != null ? '$' + a.rate + '/hr' : ''].filter(Boolean).join(' · '),
        pick: () => this.setState({ selApp: a.user_id })
      })),
      noSelApp: !selApp, sa: selApp ? this.applicantEditVals(selApp) : null,
      coordList: coords.map((o) => ({ name: o.full_name || o.email, email: o.email }))
    };

    const meKey = 'me';
    const meD = this.draft(meKey, { full_name: data.me.full_name || '', phone: data.me.phone || '', photo_url: data.me.photo_url || '' });
    out.me = { d: meD, set: this.setters(meKey, ['full_name', 'phone', 'photo_url']), onSave: () => this.act('update_me', meD, 'Your card is updated', [meKey]) };
    const invKey = 'inv';
    const invD = this.draft(invKey, { email: '', full_name: '', role: 'applicant' });
    out.inv = { d: invD, set: this.setters(invKey, ['email', 'full_name', 'role']), onSend: () => this.act('invite', invD, 'Invite sent to ' + invD.email, [invKey]) };
    const ncKey = 'nc';
    const ncD = this.draft(ncKey, { email: '', full_name: '', phone: '', zip: '', help_type: 'Housekeeper' });
    out.nc = { d: ncD, set: this.setters(ncKey, ['email', 'full_name', 'phone', 'zip', 'help_type']), onCreate: () => this.act('create_case', ncD, 'Case created', [ncKey]) };
    return out;
  }

  caseVals(c, apps, appById) {
    const key = 'c:' + c.id;
    const d = this.draft(key, { status: c.status, coordinator_user_id: c.coordinator_user_id || '', zip: c.zip, help_type: c.help_type, notes: c.notes || '', addApp: '', note: '', noteVisible: true });
    const onCase = new Set(c.applicants.map((l) => l.user_id));
    const r = c.request;
    const prefs = r ? [
      ['Services', join(r.services)], ['Days', join(r.days)], ['Frequency', r.frequency], ['Budget', r.budget_per_hour ? '$' + r.budget_per_hour + '/hr' : ''],
      ['Home', r.home_size], ['Pets', r.pets ? 'Yes' : 'No'], ['Supplies', r.supplies ? 'Has supplies' : 'Helper brings supplies'], ['Notes', r.notes]
    ].filter((x) => x[1]).map((x) => ({ k: x[0], v: x[1] })) : [];
    return {
      family: c.family, order: c.order,
      statusLabel: CASE_LABEL[c.status], statusCls: CASE_CLS[c.status] || 'pill',
      mailto: 'mailto:' + c.family.email, tel: c.family.phone ? 'tel:' + c.family.phone.replace(/[^\d+]/g, '') : '',
      opened: fmtDay(c.created_at),
      d: d, set: this.setters(key, ['status', 'coordinator_user_id', 'zip', 'help_type', 'notes', 'addApp', 'note']),
      setNoteVisible: (e) => this.setD(key, 'noteVisible', e.target.checked),
      onSave: () => this.act('update_case', { id: c.id, status: d.status, coordinator_user_id: d.coordinator_user_id, zip: d.zip, help_type: d.help_type }, 'Case saved', [key]),
      onSaveNotes: () => this.act('update_case', { id: c.id, notes: d.notes }, 'Notes saved', [key]),
      onNote: () => this.act('add_note', { case_id: c.id, body: d.note, visible: !!d.noteVisible }, d.noteVisible ? 'Update shared with the family' : 'Private note added', [key]),
      onAdd: () => { if (!d.addApp) { this.toast('Choose an applicant first.', true); return; } this.act('add_applicant', { case_id: c.id, applicant_user_id: d.addApp }, 'Applicant added and emailed', [key]); },
      request: r, prefs: prefs,
      noApplicants: !c.applicants.length,
      applicants: c.applicants.map((l) => {
        const lk = 'l:' + l.id;
        const ld = this.draft(lk, { status: l.status, interview_at: isoToEtInput(l.interview_at) });
        const a = appById[l.user_id] || {};
        return {
          name: l.name || a.email || 'Applicant',
          statusLabel: (LINK_LABEL[l.status] || l.status) + (l.interview_at ? ' · ' + fmtET(l.interview_at) : ''),
          d: ld, set: this.setters(lk, ['status', 'interview_at']),
          onSave: () => this.act('update_link', { id: l.id, status: ld.status, interview_at: ld.interview_at ? etInputToIso(ld.interview_at) : '' }, 'Applicant updated', [lk])
        };
      }),
      addOptions: apps.filter((a) => !onCase.has(a.user_id) && a.status !== 'paused' && !a.disabled)
        .sort((x, y) => (y.status === 'active') - (x.status === 'active') || (y.zip === c.zip) - (x.zip === c.zip))
        .map((a) => ({ id: a.user_id, label: [a.full_name || a.email, ROLE_LABEL[a.role_type], a.zip ? 'ZIP ' + a.zip : '', PROFILE_LABEL[a.status]].filter(Boolean).join(' · ') })),
      events: c.events.map((e) => ({ body: e.body, when: fmt(e.created_at), by: e.actor ? ' · ' + e.actor : '', who: e.visible ? 'Family sees' : 'Private', cls: e.visible ? 'pill green' : 'pill grey' }))
    };
  }

  applicantEditVals(a) {
    const key = 'a:' + a.user_id;
    const d = this.draft(key, {
      full_name: a.full_name || '', phone: a.phone || '', photo_url: a.photo_url || '', role_type: a.role_type || 'housekeeper',
      zip: str(a.zip), city: str(a.city), rate: str(a.rate), years: str(a.years), start_in_days: str(a.start_in_days),
      languages: join(a.languages), skills: join(a.skills), days: join(a.days), hours: str(a.hours), bio: str(a.bio),
      status: a.status || 'draft', check_background: a.check_background || 'not_started',
      check_interview: !!a.check_interview, check_id: !!a.check_id, check_references: !!a.check_references, coordinator_notes: str(a.coordinator_notes)
    });
    const tick = {};
    ['check_interview', 'check_id', 'check_references'].forEach((k) => { tick[k] = (e) => this.setD(key, k, e.target.checked); });
    return {
      title: a.full_name || a.email, email: a.email, mailto: 'mailto:' + a.email,
      lastLogin: a.last_login_at ? '· Last signed in ' + fmtDay(a.last_login_at) : '· Hasn’t signed in yet',
      statusLabel: PROFILE_LABEL[a.status] || a.status, statusCls: PROFILE_CLS[a.status] || 'pill',
      d: d, tick: tick,
      set: this.setters(key, ['full_name', 'phone', 'photo_url', 'role_type', 'zip', 'city', 'rate', 'years', 'start_in_days', 'languages', 'skills', 'days', 'hours', 'bio', 'status', 'check_background', 'coordinator_notes']),
      onSave: () => this.act('update_applicant', Object.assign({ user_id: a.user_id }, d, { days: d.days.split(',').map((x) => x.trim()).filter(Boolean) }), 'Applicant saved', [key]),
      onSendLink: () => this.act('invite', { email: a.email, role: 'applicant' }, 'Sign-in link sent to ' + a.email)
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
