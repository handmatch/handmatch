<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us · handmatch</title>
<meta name="description" content="Email, call or write to the handmatch team.">
<meta property="og:title" content="Contact us · handmatch">
<meta property="og:description" content="Email, call or write to the handmatch team.">
<meta property="og:image" content="/assets/img/fb-profile-1080.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/img/fb-profile-1080.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAF7}
a{color:#4F5D4C}
.hm-card{transition:border-color .2s ease, transform .2s ease}
.hm-card:hover{border-color:#B39A6B;transform:translateY(-2px)}
input:focus,textarea:focus,select:focus{outline:2px solid #4F5D4C;outline-offset:1px}
</style>
</head>
<body>
<div id="hm-root"></div>
<template id="hm-tpl">
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #2A2722; background: #FBFAF7; min-height: 100vh">

  <header style="padding: 20px 24px; border-bottom: 1px solid #ECE6DC">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2A2722">
        <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M8.5 22.5L24 10l15.5 12.5" fill="none" stroke="#2A2722" stroke-width="1.955" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="19" cy="24" r="3.4" fill="none" stroke="#2A2722" stroke-width="1.955"></circle><path d="M12.5 37.5c0-5 2.9-7.6 6.5-7.6s6.5 2.6 6.5 7.6" fill="none" stroke="#2A2722" stroke-width="1.955" stroke-linecap="round"></path><circle cx="29" cy="24" r="3.4" fill="none" stroke="#B39A6B" stroke-width="1.955"></circle><path d="M22.5 37.5c0-5 2.9-7.6 6.5-7.6s6.5 2.6 6.5 7.6" fill="none" stroke="#B39A6B" stroke-width="1.955" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.03em">handmatch</span>
      </a>
      <a href="/" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #2A2722; text-decoration: none; font-weight: 500; font-size: 16px">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to handmatch
      </a>
    </div>
  </header>

  <section style="padding: clamp(48px, 7vw, 88px) 24px 40px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 40px; height: 1px; background: #B39A6B"></span>
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #7E6A45">Contact us</span>
      </div>
      <h1 style="margin: 0; max-width: 820px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: clamp(36px, 6vw, 68px); line-height: 0.98; letter-spacing: -0.03em">We’d love to <em style="font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; letter-spacing: -0.01em; color: #7E6A45">hear from you.</em></h1>
      <p style="margin: 0; max-width: 600px; font-size: 19px; font-weight: 400; line-height: 1.6; color: #4A443C">Questions about finding help, your plan or joining as a cleaner, housekeeper or nanny? A real person reads every message.</p>
    </div>
  </section>

  <section style="padding: 0 24px clamp(80px, 10vw, 120px)">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

      <!-- Contact details -->
      <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <a class="hm-card" href="mailto:hello.handmatch@gmail.com" style="display: flex; gap: 18px; align-items: flex-start; padding: 24px; border-radius: 24px; background: #FFFFFF; border: 1px solid #ECE6DC; text-decoration: none; color: #2A2722">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 999px; background: #DFE5DC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D4A3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 6.5l8.5 6 8.5-6"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #7E6A45">Email</span>
            <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 19px; letter-spacing: -0.01em; overflow-wrap: anywhere">hello.handmatch@gmail.com</span>
            <span style="font-size: 14px; color: #6F6152">We reply within one business day</span>
          </span>
        </a>

        <a class="hm-card" href="tel:+16466612206" style="display: flex; gap: 18px; align-items: flex-start; padding: 24px; border-radius: 24px; background: #FFFFFF; border: 1px solid #ECE6DC; text-decoration: none; color: #2A2722">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 999px; background: #DFE5DC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D4A3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #7E6A45">Call or text</span>
            <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 19px; letter-spacing: -0.01em">+1 (646) 661-2206</span>
            <span style="font-size: 14px; color: #6F6152">Talk to a real person</span>
          </span>
        </a>

        <div style="display: flex; gap: 18px; align-items: flex-start; padding: 24px; border-radius: 24px; background: #F3EEE6">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 999px; background: #FBFAF7; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7E6A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #7E6A45">Mailing address</span>
            <address style="font-style: normal; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 18px; line-height: 1.4; letter-spacing: -0.01em">handmatch<br>2810 N Church St. STE 90921<br>Wilmington, DE 19802</address>
            <span style="font-size: 14px; color: #6F6152">Mail only · no walk-ins</span>
          </span>
        </div>
      </div>

      <!-- Form -->
      <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{onSend}}" style="flex: 999 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 28px; padding: clamp(24px, 4vw, 44px); display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
          <h2 style="margin: 0; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em">Send us a message</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 20px">
            <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px">
              <label for="ct-name" style="font-weight: 500; font-size: 15px">Full name</label>
              <input id="ct-name" type="text" autocomplete="name" value="{{name}}" onInput="{{onName}}" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #DDD5C8; background: #FBFAF7; font-family: inherit; font-size: 16px; color: #2A2722">
            </div>
            <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px">
              <label for="ct-email" style="font-weight: 500; font-size: 15px">Email</label>
              <input id="ct-email" type="email" autocomplete="email" value="{{email}}" onInput="{{onEmail}}" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #DDD5C8; background: #FBFAF7; font-family: inherit; font-size: 16px; color: #2A2722">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="ct-topic" style="font-weight: 500; font-size: 15px">I’m reaching out about</label>
            <select id="ct-topic" value="{{topic}}" onChange="{{onTopic}}" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #DDD5C8; background: #FBFAF7; font-family: inherit; font-size: 16px; color: #2A2722">
              <option>Finding a cleaner, housekeeper or nanny</option>
              <option>My plan or payment</option>
              <option>Joining handmatch as a helper</option>
              <option>Press or partnerships</option>
              <option>Something else</option>
            </select>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="ct-msg" style="font-weight: 500; font-size: 15px">Message</label>
            <textarea id="ct-msg" rows="5" value="{{msg}}" onInput="{{onMsg}}" style="padding: 14px 16px; border-radius: 14px; border: 1px solid #DDD5C8; background: #FBFAF7; font-family: inherit; font-size: 16px; line-height: 1.5; color: #2A2722; resize: vertical"></textarea>
          </div>
          <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
            <p role="alert" style="margin: 0; font-size: 15px; color: #9A3412">{{error}}</p>
          </sc-if>
          <button type="submit" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 30px; border-radius: 999px; border: 0; background: #2A2722; color: #FBFAF7; font-family: inherit; font-weight: 500; font-size: 16px; cursor: pointer">{{sendLabel}}
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </button>
        </form>
      </sc-if>
      <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="flex: 999 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 28px; padding: clamp(28px, 5vw, 56px); display: flex; flex-direction: column; align-items: flex-start; gap: 16px; box-sizing: border-box">
          <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 999px; background: #4F5D4C; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <h2 style="margin: 0; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.02em">Thanks, {{firstName}}. Message received.</h2>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #4A443C">We’ll get back to you at {{email}} within one business day.</p>
        </div>
      </sc-if>
    </div>
  </section>

  <footer style="padding: 36px 24px; background: #24211D; color: #B5AC9C">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px">
      <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 18px; color: #FBFAF7; letter-spacing: -0.03em">handmatch</span>
      <span>© 2026 handmatch</span>
    </div>
  </footer>
</div>
</template>
<noscript><p style="font-family: sans-serif; padding: 24px">Please turn on JavaScript to use handmatch.</p></noscript>
<script>window.HM_PROPS = {};</script>
<script src="/assets/hm-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', email: '', msg: '', topic: 'Finding a cleaner, housekeeper or nanny', sent: false, error: '', busy: false };
  }
  renderVals() {
    const s = this.state;
    const set = (k) => (e) => this.setState({ [k]: e.target.value, error: '' });
    return {
      name: s.name, email: s.email, msg: s.msg,
      topic: s.topic, onTopic: set('topic'), sendLabel: s.busy ? 'Sending…' : 'Send message',
      onName: set('name'), onEmail: set('email'), onMsg: set('msg'),
      showForm: !s.sent, sent: s.sent,
      hasError: !!s.error, error: s.error,
      firstName: s.name.trim().split(/\s+/)[0] || 'there',
      onSend: (e) => {
        e.preventDefault();
        let err = '';
        if (!s.name.trim()) err = 'Please enter your name.';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim())) err = 'Please enter a valid email.';
        else if (s.msg.trim().length < 5) err = 'Please write a short message.';
        if (err) { this.setState({ error: err }); return; }
        this.setState({ busy: true, error: '' });
        hmPost('/api/contact', { name: s.name.trim(), email: s.email.trim(), topic: s.topic, message: s.msg.trim() })
          .then(() => this.setState({ sent: true, busy: false }))
          .catch((err) => this.setState({ busy: false, error: err.message }));
      }
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
