              <div style="display: flex; flex-direction: column; gap: 6px; padding: 6px 0 30px; min-width: 0">
                <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px">

                </div>
                <span style="font-size: 16px; line-height: 1.6; color: #4A443C; max-width: 560px">{{st.body}}</span>
              </div>
            </li>
          </sc-for>
        </ol>

        <!-- While you wait -->
        <div style="background: #F3EEE6; border-radius: 28px; padding: clamp(24px, 4vw, 36px); display: flex; flex-direction: column; gap: 18px">
          <h2 style="margin: 0; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.02em">Before we call, <em style="font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; color: #7E6A45">have a think about…</em></h2>

      </div>

      <!-- Sidebar -->
      <aside aria-label="Your advisor and receipt" style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
          <img src="/assets/img/marvin-founder.jpg" alt="Marvin Perol, founder of handmatch" style="width: 120px; height: 120px; border-radius: 999px; object-fit: cover; background: #F3EEE6; border: 5px solid #FFFFFF; box-shadow: 0 10px 28px rgba(42, 39, 34, 0.12)">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.02em">Marvin &amp; team</span>
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #7E6A45">Your handmatch team</span>
          </div>
          <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A443C">“Thanks for trusting us with your home. We’ll call you at <strong style="color: #2A2722; font-weight: 500">{{phone}}</strong> shortly—save our number so you know it’s us.”</p>
          <a href="/handmatch.vcf" download style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #2A2722; color: #FBFAF7; text-decoration: none; font-weight: 500; font-size: 15px">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Save our contact
          </a>
          <span style="font-size: 13px; color: #6F6152">Calls and texts 8am–8pm ET · +1 (646) 661-2206</span>
        </div>

        <div style="background: #2A2722; color: #FBFAF7; border-radius: 28px; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
          <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #CDBB98">Receipt</span>
          <dl style="margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px">

<script>window.HM_PROPS = {"fullName": "Jordan Rivera", "email": "jordan@example.com", "phone": "(917) 555-0142", "hires": 1};</script>
<script src="/assets/hm-runtime.js"></script>
<script>
class Component extends DCLogic {

  componentDidMount() {
    const q = new URLSearchParams(location.search);
    const sid = q.get('session_id');
    const oid = q.get('order_id');
    if (!sid && !oid) return;
    fetch('/api/order?' + (sid ? 'session_id=' + encodeURIComponent(sid) : 'order_id=' + encodeURIComponent(oid)))
      .then((r) => (r.ok ? r.json() : null))
      .then((o) => { if (o) this.setState({ order: o }); })
      .catch(() => {});
  }
  renderVals() {
    const o = (this.state && this.state.order) || {};
    const p = { fullName: o.full_name, email: o.email, phone: o.phone, hires: o.hires };
    const fullName = p.fullName || 'there';
    const n = Math.max(1, Number(p.hires) || 1);
    const steps = [
      { title: 'Payment confirmed', when: 'Done', body: 'Your receipt is in your inbox.', state: 'done' },
      { title: 'Our team calls you', when: 'Right away', body: 'A short, friendly call to get to know your home: schedule, priorities, pets, kids and anything that matters to you.', state: 'current' },
      { title: 'Background checks on your picks', when: 'Within 24 hours', body: 'We run a background check on each of your picks and share the results before anyone sets foot in your home.', state: 'next' },
      { title: 'Meet your matches', when: 'In the next few days', body: 'We walk you through your first 3 picks. Ask anything, trust your gut, and choose the one who feels right. Not quite right? We’ll handpick more.', state: 'next' },
      { title: 'Your help actually starts', when: '5–7 days on average', body: 'Agree on your rate and schedule directly—no agency in the middle. Up to 3 replacements within 90 days after your first hire starts.', state: 'next' }
    ];
    return {
      firstName: fullName.trim().split(/\s+/)[0],
      fullName,
      email: p.email || 'your inbox',
      orderRef: o.order_ref || '—',
      phone: p.phone || 'your number',
      plan: 'One-time fee · ' + (n === 1 ? '1 hire' : n + ' hires'),
      price: (o.amount_cents ? o.amount_cents / 100 : 349 * n).toLocaleString('en-US'),
      repl: 'Up to 3 within 90 days',
      steps: steps.map((s, i) => ({
        n: i + 1, title: s.title, when: s.when, body: s.body,
        done: s.state === 'done', notDone: s.state !== 'done',
        current: s.state === 'current' ? 'step' : 'false',
        dotBg: s.state === 'done' ? '#4F5D4C' : (s.state === 'current' ? '#DFE5DC' : '#FFFFFF'),
        dotBorder: s.state === 'done' ? '0' : (s.state === 'current' ? '2px solid #4F5D4C' : '1.5px solid #DDD5C8'),
        dotInk: s.state === 'current' ? '#3D4A3B' : '#7A6E60',
        whenInk: s.state === 'done' ? '#4F5D4C' : (s.state === 'current' ? '#7E6A45' : '#8A7F70'),
        hasLine: i < steps.length - 1,
        line: s.state === 'done' ? '#4F5D4C' : '#E4DDD1'
      })),
      prep: [
        'Which days and times work best for you',
        'Your must-haves: pets, kids, allergies, languages',
        'How they’ll get in: keys, doorman or lockbox',
        'Any questions you’d like to ask your picks'
      ]
    };
  }
}
window.Component = Component;
</script>
